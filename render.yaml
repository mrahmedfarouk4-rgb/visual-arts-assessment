services:
  - type: web
    name: visual-arts-assessment
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run deploy
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: visual-arts-db
          property: connectionString
      - key: NODE_ENV
        value: production

databases:
  - name: visual-arts-db
    plan: free
